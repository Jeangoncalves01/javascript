<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        body {
            background-color: rgb( 105, 105, 173);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>

    <script>
        var n1 = Number(window.prompt('Digite um número: ')) // O "prompt" é lido como string, mesmo se for números.
        var n2 = Number(window.prompt('Digite outro número: '))
        var s = n1 + n2
        window.alert(`A soma de ${n1} e ${n2} é igual a ${s} `) // Cocatenação
        // (number + number) para adição
        // (string + string) para concatenação
    </script>
</body>
</html>
